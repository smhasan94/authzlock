[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[project]
name = "authzlock"
dynamic = ["version"]
description = "An authorization lockfile for Django and Django REST Framework."
readme = "README.md"
license = "MIT"
requires-python = ">=3.10"
authors = [{ name = "Sharukh Hasan" }]
keywords = ["django", "drf", "authorization", "permissions", "security", "lockfile"]
classifiers = [
  "Development Status :: 2 - Pre-Alpha",
  "Environment :: Console",
  "Framework :: Django",
  "Framework :: Django :: 4.2",
  "Framework :: Django :: 5.1",
  "Framework :: Django :: 5.2",
  "Intended Audience :: Developers",
  "License :: OSI Approved :: MIT License",
  "Operating System :: OS Independent",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Topic :: Security",
  "Topic :: Software Development :: Quality Assurance",
  "Typing :: Typed",
]
dependencies = [
  "typer>=0.12",
  "pyyaml>=6",
]

[project.optional-dependencies]
dev = [
  "pytest>=8",
  "ruff==0.16.9",
  "mypy>=1.11",
  "nox>=2024.4",
  "build>=1.2",
  "hatchling>=1.25",
  "pre-commit>=3.8",
  "types-PyYAML",
  "django>=4.2",
  "djangorestframework>=3.14",
]

[project.scripts]
authzlock = "authzlock.cli:app"

[project.urls]
Homepage = "https://github.com/smhasan94/authzlock"
Issues = "https://github.com/smhasan94/authzlock/issues"

[tool.hatch.version]
path = "src/authzlock/__init__.py"

[tool.hatch.build.targets.wheel]
packages = ["src/authzlock"]

[tool.hatch.build.targets.sdist]
exclude = ["/tests", "/docs", "/.github", "/.venv", "/DEVELOPMENT.md"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["slow: builds packages or creates virtualenvs; takes several seconds"]

[tool.ruff]
line-length = 100
target-version = "py310"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "W", "F", "I", "UP", "B", "SIM"]

[tool.ruff.lint.isort]
known-first-party = ["authzlock"]

[tool.ruff.format]
docstring-code-format = true

[tool.mypy]
strict = true
files = ["src/authzlock"]
python_version = "3.10"
warn_unused_ignores = true
show_error_codes = true
pretty = false

[[tool.mypy.overrides]]
module = ["django.*", "rest_framework.*"]
ignore_missing_imports = true
