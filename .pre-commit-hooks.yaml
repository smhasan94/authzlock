# Hooks that other repositories can use to keep their authz.lock current.
# Usage and configuration: docs/pre-commit.md.
#
# pre-commit runs hooks from the repository root. The entry `python -m authzlock` gets the
# current directory on sys.path from the interpreter; the `authzlock` script would work as
# well, since authzlock puts the current directory first on sys.path itself. Either way the
# project's settings module can be imported without setting PYTHONPATH.
- id: authzlock-check
  name: authzlock check
  description: Fail when authz.lock does not match the Django project's access rules.
  entry: python -m authzlock check
  language: python
  pass_filenames: false
  always_run: true
  require_serial: true
- id: authzlock-update
  name: authzlock update
  description: Rewrite authz.lock from the Django project; fails when the file changed.
  entry: python -m authzlock update
  language: python
  pass_filenames: false
  always_run: true
  require_serial: true
