name: Post-release verify

# Run by hand after a release (see "Verify the release" in docs/releasing.md):
#
#   gh workflow run post-release-verify.yml -f version=X.Y.Z
#
# `install` installs authzlock==X.Y.Z from PyPI into a fresh virtual environment on the oldest
# and newest supported Python, checks `authzlock --version`, and runs the README quickstart
# test from the vX.Y.Z checkout against the installed package (the checkout's src/ is removed
# first). `v1-tag` checks that the action's v1 tag points at the release commit, and
# `action-v1` runs `smhasan94/authzlock@v1` on the docs/scenario.md project.

on:
  workflow_dispatch:
    inputs:
      version:
        description: The released version, without the leading v (for example 0.1.0)
        type: string
        required: true

permissions:
  contents: read

env:
  PIP_DISABLE_PIP_VERSION_CHECK: "1"
  VERSION: ${{ inputs.version }}

jobs:
  install:
    name: install (python=${{ matrix.python }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python: ["3.10", "3.13"]
    steps:
      - uses: actions/checkout@v4
        with:
          ref: v${{ inputs.version }}
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - name: Install from PyPI into a fresh virtual environment
        run: |
          python -m venv "$RUNNER_TEMP/venv"
          # A new release can take a minute to reach every PyPI mirror.
          for attempt in 1 2 3 4 5; do
            "$RUNNER_TEMP/venv/bin/pip" install --quiet --no-cache-dir authzlock=="$VERSION" && break
            if [ "$attempt" = 5 ]; then exit 1; fi
            sleep 30
          done
      - name: Check the version
        run: |
          actual="$("$RUNNER_TEMP/venv/bin/authzlock" --version)"
          echo "$actual"
          if [ "$actual" != "authzlock $VERSION" ]; then
            echo "::error::authzlock --version printed '$actual', expected 'authzlock $VERSION'."
            exit 1
          fi
      - name: Run the README quickstart against the installed package
        run: |
          rm -rf src
          "$RUNNER_TEMP/venv/bin/pip" install --quiet pytest djangorestframework drf-nested-routers
          "$RUNNER_TEMP/venv/bin/python" -c "import authzlock, sys; print(authzlock.__file__); sys.exit('site-packages' not in authzlock.__file__)"
          "$RUNNER_TEMP/venv/bin/python" -m pytest -p no:cacheprovider \
            tests/test_readme.py::test_t1_quickstart_commands_run_as_documented

  v1-tag:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          fetch-tags: true
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Check that v1 points at the release
        run: python scripts/ci/check_v1_tag.py "v$VERSION"

  action-v1:
    needs: v1-tag
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: v${{ inputs.version }}
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install the scenario's dependencies
        run: python -m pip install --quiet "django~=5.2.0" "djangorestframework>=3.16"
      - name: Prepare the scenario with the loosening edit
        run: python scripts/ci/prepare_scenario.py "$RUNNER_TEMP/scenario" --loosen
      - name: Run the published action
        id: authzlock
        uses: smhasan94/authzlock@v1
        with:
          settings-module: settings
          python-version: ""
          working-directory: ${{ runner.temp }}/scenario
          base-ref: HEAD
          fail-on-loosened: "false"
          comment: "false"
      - name: Check the report
        env:
          REPORT: ${{ steps.authzlock.outputs.report-path }}
        run: >-
          python scripts/ci/assert_summary.py "$REPORT"
          --summary "1 loosened, 0 tightened, 0 added, 0 removed, 0 changed-unknown, 0 equivalent"
          --row loosened --row-contains DELETE
          --row-contains billing.views.InvoiceDetailView
