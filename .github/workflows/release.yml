name: Release

# A pushed `v*` tag publishes to PyPI. A manual dispatch publishes to TestPyPI by default
# (a dry run) or to PyPI when `target` is `pypi`. Publishing uses trusted publishing, so no
# token is stored anywhere; see docs/releasing.md for the one-time setup.

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      target:
        description: Index to publish to
        type: choice
        options: [testpypi, pypi]
        default: testpypi
      tag:
        description: Tag to check the package version against, for example v0.0.1.dev1 (optional)
        type: string
        required: false

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Build the sdist and wheel
        run: |
          pip install build
          python -m build
      - name: Check the tag matches the package version
        env:
          TAG: ${{ github.event_name == 'push' && github.ref_name || inputs.tag }}
        run: |
          wheel=$(ls dist/*.whl)
          version=$(basename "$wheel" | cut -d- -f2)
          echo "Built version: $version"
          if [ -z "$TAG" ]; then
            echo "No tag given; skipping the tag check."
            exit 0
          fi
          if [ "${TAG#v}" != "$version" ]; then
            echo "::error::Tag $TAG does not match the package version $version (authzlock.__version__)."
            exit 1
          fi
          echo "Tag $TAG matches the package version $version."
      - name: Smoke-test the wheel in a fresh environment
        run: |
          python -m venv "$RUNNER_TEMP/smoke"
          "$RUNNER_TEMP/smoke/bin/pip" install --quiet dist/*.whl
          version=$(basename dist/*.whl | cut -d- -f2)
          actual=$(PATH="$RUNNER_TEMP/smoke/bin:$PATH" authzlock --version)
          echo "$actual"
          if [ "$actual" != "authzlock $version" ]; then
            echo "::error::authzlock --version printed '$actual', expected 'authzlock $version'."
            exit 1
          fi
      - name: Upload the distributions
        uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/
          if-no-files-found: error

  publish-pypi:
    needs: build
    if: github.event_name == 'push' || inputs.target == 'pypi'
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/p/authzlock
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/
      - uses: pypa/gh-action-pypi-publish@release/v1

  publish-testpypi:
    needs: build
    if: github.event_name == 'workflow_dispatch' && inputs.target == 'testpypi'
    runs-on: ubuntu-latest
    environment:
      name: testpypi
      url: https://test.pypi.org/p/authzlock
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/
      - uses: pypa/gh-action-pypi-publish@release/v1
        with:
          repository-url: https://test.pypi.org/legacy/
